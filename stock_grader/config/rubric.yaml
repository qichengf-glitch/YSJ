# =============================================================================
# rubric.yaml -- THE SINGLE SOURCE OF TRUTH FOR ALL SCORING
# =============================================================================
# Edit thresholds HERE, never in Python. The scoring engine is a generic band
# evaluator; this file is the rubric. That guarantees the code and the written
# rubric can never drift apart.
#
# BAND SEMANTICS
#   direction: higher_better -> first band whose threshold the value is >= wins
#   direction: lower_better  -> first band whose threshold the value is <= wins
#   Bands MUST be listed best-grade-first. Anything falling through all bands
#   receives the `else` grade.
#
#   Grades map to numbers via grade_points below. Category score = MEDIAN of the
#   available sub-metric points, then caps applied, then rounded to integer.
#
#   skip_if: a Python expression evaluated against the metric namespace. If it
#   returns True the sub-metric is dropped (not scored as F). Used for the
#   "skip P/E and PEG if EPS <= 0" rule.
# =============================================================================

grade_points:   # midpoint convention from the analyst manual
  A: 9.5
  B: 7.5
  C: 5.5
  D: 3.5
  F: 1.5

# Score floor/ceiling written into the spreadsheet
score_min: 1
score_max: 10

categories:

  # ---------------------------------------------------------------- 1
  valuation:
    display: "Valuation"
    sheet_row_offset: 1          # row 1 of the 10 category rows in each block
    aggregate: median
    submetrics:

      fcf_yield:
        label: "FCF yield"
        field: fcf_yield
        unit: pct
        direction: higher_better
        bands: [[0.06, A], [0.04, B], [0.025, C], [0.01, D]]
        else: F

      pe_vs_own_median:
        label: "Fwd P/E vs own 5-yr median"
        field: pe_discount_vs_5yr_median   # +0.25 == 25% cheaper than history
        unit: pct
        direction: higher_better
        bands: [[0.25, A], [0.10, B], [-0.10, C], [-0.30, D]]
        else: F
        skip_if: "fwd_eps is None or fwd_eps <= 0"

      tev_ebitda_vs_peers:
        label: "Fwd TEV/EBITDA vs peer median"
        field: tev_ebitda_discount_vs_peers
        unit: pct
        direction: higher_better
        bands: [[0.25, A], [0.10, B], [-0.10, C], [-0.30, D]]
        else: F
        # Meaningless where EBITDA is negative (clinical-stage biotech) or
        # where enterprise value is not a coherent concept (banks). peers.py
        # also suppresses it upstream; this is the belt-and-braces half.
        skip_if: "ebitda is not None and ebitda <= 0"

      peg:
        label: "PEG"
        field: peg
        unit: ratio
        direction: lower_better
        bands: [[1.0, A], [1.3, B], [1.8, C], [2.5, D]]
        else: F
        skip_if: "fwd_eps is None or fwd_eps <= 0"

  # ---------------------------------------------------------------- 2
  growth:
    display: "Growth"
    sheet_row_offset: 2
    aggregate: median
    submetrics:
      fwd_revenue_growth:
        label: "Fwd revenue growth"
        field: fwd_revenue_growth
        unit: pct
        direction: higher_better
        bands: [[0.15, A], [0.08, B], [0.03, C], [0.00, D]]
        else: F
      fwd_eps_growth:
        label: "Fwd EPS growth"
        field: fwd_eps_growth
        unit: pct
        direction: higher_better
        bands: [[0.20, A], [0.10, B], [0.05, C], [0.00, D]]
        else: F
        # "A>20% AND > revenue growth" -- the extra condition is enforced by
        # demote_if, which knocks an A down to B when it is not satisfied.
        demote_if: "fwd_revenue_growth is not None and fwd_eps_growth is not None and fwd_eps_growth <= fwd_revenue_growth"
        demote_from: A
        demote_to: B
      gross_margin_trend_3y:
        label: "3-yr gross margin trend (bps)"
        field: gross_margin_trend_3y_bps
        unit: bps
        direction: higher_better
        bands: [[100, A], [0, B], [-1, C], [-200, D]]
        else: F
      guidance_net_raises:
        label: "Net guidance raises, last 8Q"
        field: guidance_net_raises_8q
        unit: count
        direction: higher_better
        bands: [[4, A], [1, B], [0, C], [-2, D]]
        else: F

    # Archetype C replaces the whole sub-metric set (per the rubric override)
    archetype_overrides:
      C:
        fwd_revenue_growth:
          label: "Fwd revenue growth (high-growth bands)"
          field: fwd_revenue_growth
          unit: pct
          direction: higher_better
          bands: [[0.40, A], [0.25, B], [0.15, C], [0.08, D]]
          else: F
        rule_of_40:
          label: "Rule of 40 (growth% + FCF margin%)"
          field: rule_of_40
          unit: points
          direction: higher_better
          bands: [[50, A], [40, B], [25, C], [10, D]]
          else: F
        nrr:
          label: "Net revenue retention"
          field: nrr
          unit: pct
          direction: higher_better
          bands: [[1.20, A], [1.10, B], [1.00, C], [0.90, D]]
          else: F
        gross_margin:
          label: "Gross margin"
          field: gross_margin
          unit: pct
          direction: higher_better
          bands: [[0.75, A], [0.65, B], [0.50, C], [0.35, D]]
          else: F

  # ---------------------------------------------------------------- 3
  profitability:
    display: "Profitability"
    sheet_row_offset: 3
    aggregate: median
    submetrics:
      roic_3y_avg:
        label: "ROIC 3-yr average"
        field: roic_3y_avg
        unit: pct
        direction: higher_better
        bands: [[0.20, A], [0.13, B], [0.09, C], [0.04, D]]
        else: F
      roic_persistence:
        label: "ROIC persistence (share of yrs >12%)"
        field: roic_persistence
        unit: pct
        direction: higher_better
        bands: [[0.80, A], [0.60, B], [0.40, C], [0.20, D]]
        else: F
      gm_vs_peers:
        label: "Gross margin vs peer set"
        field: gm_percentile_vs_peers
        unit: pct
        direction: higher_better
        bands: [[0.75, A], [0.55, B], [0.45, C], [0.25, D]]
        else: F
      roe:
        label: "Return on equity"
        field: roe
        unit: pct
        direction: higher_better
        bands: [[0.20, A], [0.15, B], [0.10, C], [0.05, D]]
        else: F
        # A requires D/E < 1; and any D/E > 2 costs one notch.
        demote_if: "debt_to_equity is not None and debt_to_equity >= 1.0"
        demote_from: A
        demote_to: B
        notch_down_if: "debt_to_equity is not None and debt_to_equity > 2.0"

    archetype_overrides:
      F:
        roe:
          label: "Return on equity (financials bands)"
          field: roe
          unit: pct
          direction: higher_better
          bands: [[0.15, A], [0.12, B], [0.09, C], [0.06, D]]
          else: F
        efficiency_ratio:
          label: "Efficiency ratio"
          field: efficiency_ratio
          unit: pct
          direction: lower_better
          bands: [[0.50, A], [0.60, B], [0.70, C], [0.80, D]]
          else: F

  # ---------------------------------------------------------------- 4
  financials:
    display: "Financials"
    sheet_row_offset: 4
    aggregate: median
    submetrics:
      net_debt_ebitda:
        label: "Net debt / EBITDA"
        field: net_debt_to_ebitda
        unit: turns
        direction: lower_better
        bands: [[0.5, A], [1.5, B], [2.5, C], [4.0, D]]
        else: F
      interest_coverage:
        label: "EBIT / interest expense"
        field: interest_coverage
        unit: turns
        direction: higher_better
        bands: [[12, A], [8, B], [4, C], [2, D]]
        else: F
      fcf_conversion:
        label: "FCF / net income (3-yr)"
        field: fcf_to_ni_3y
        unit: pct
        direction: higher_better
        bands: [[1.00, A], [0.85, B], [0.70, C], [0.50, D]]
        else: F
        skip_if: "cum_net_income_3y is None or cum_net_income_3y <= 0"
      share_count_cagr:
        label: "Diluted share count 3-yr CAGR"
        field: share_count_cagr_3y
        unit: pct
        direction: lower_better
        bands: [[0.0, A], [0.01, B], [0.03, C], [0.06, D]]
        else: F

    archetype_overrides:
      C: &runway_override
        cash_runway_years:
          label: "Cash runway (yrs) -- dominant when FCF-negative"
          field: cash_runway_years
          unit: years
          direction: higher_better
          bands: [[99, A], [4.0, B], [2.5, C], [1.5, D]]
          else: F
        net_debt_ebitda:
          label: "Net debt / EBITDA"
          field: net_debt_to_ebitda
          unit: turns
          direction: lower_better
          bands: [[0.5, A], [1.5, B], [2.5, C], [4.0, D]]
          else: F
        share_count_cagr:
          label: "Diluted share count 3-yr CAGR"
          field: share_count_cagr_3y
          unit: pct
          direction: lower_better
          bands: [[0.0, A], [0.01, B], [0.03, C], [0.06, D]]
          else: F
      E: *runway_override
      F:
        cet1_ratio:
          label: "CET1 ratio"
          field: cet1_ratio
          unit: pct
          direction: higher_better
          bands: [[0.13, A], [0.11, B], [0.10, C], [0.09, D]]
          else: F
        share_count_cagr:
          label: "Diluted share count 3-yr CAGR"
          field: share_count_cagr_3y
          unit: pct
          direction: lower_better
          bands: [[0.0, A], [0.01, B], [0.03, C], [0.06, D]]
          else: F

  # ---------------------------------------------------------------- 5
  business_quality:
    display: "Business Quality"
    sheet_row_offset: 5
    aggregate: median
    tier: 3                       # partly judgment -> manual override expected
    submetrics:
      roic_persistence:
        label: "ROIC persistence (share of yrs >12%)"
        field: roic_persistence
        unit: pct
        direction: higher_better
        bands: [[0.80, A], [0.60, B], [0.40, C], [0.20, D]]
        else: F
      gm_stability:
        label: "Gross margin stability (band, bps)"
        field: gross_margin_band_bps
        unit: bps
        direction: lower_better
        bands: [[200, A], [400, B], [800, C], [1500, D]]
        else: F
      moat_language:
        label: "10-K moat language (LLM)"
        field: llm_moat_score
        unit: grade_points
        direction: higher_better
        bands: [[9, A], [7, B], [5, C], [3, D]]
        else: F
    # any customer >10% of revenue deducts one notch from this category
    notch_down_if: "max_customer_pct is not None and max_customer_pct > 0.10"

  # ---------------------------------------------------------------- 6
  management:
    display: "Management"
    sheet_row_offset: 6
    aggregate: median
    submetrics:
      sbc_pct_revenue:
        label: "SBC as % of revenue"
        field: sbc_pct_revenue
        unit: pct
        direction: lower_better
        bands: [[0.05, A], [0.08, B], [0.12, C], [0.15, D]]
        else: F
      beat_rate:
        label: "EPS beats, last 8Q"
        field: beat_count_8q
        unit: count
        direction: higher_better
        bands: [[6, A], [5, B], [4, C], [2, D]]
        else: F
      insider_activity:
        label: "Insider net open-market activity"
        field: insider_net_score          # -2..+2 computed in metrics.py
        unit: score
        direction: higher_better
        bands: [[1.5, A], [0.5, B], [-0.5, C], [-1.5, D]]
        else: F
    caps:
      - when: "goodwill_impairment_pct_equity is not None and goodwill_impairment_pct_equity > 0.05"
        cap_at: 5.5
        reason: "goodwill impairment >5% of equity"

  # ---------------------------------------------------------------- 7
  income:
    display: "Income"
    sheet_row_offset: 7
    aggregate: median
    tier: 3
    submetrics:
      recurring_revenue_pct:
        label: "Recurring revenue %"
        field: recurring_revenue_pct
        unit: pct
        direction: higher_better
        bands: [[0.70, A], [0.50, B], [0.30, C], [0.0001, D]]
        else: F
      rpo_coverage:
        label: "RPO / backlog vs annual revenue"
        field: rpo_coverage
        unit: turns
        direction: higher_better
        bands: [[1.0, A], [0.5, B], [0.25, C], [0.0001, D]]
        else: F
      worst_year_revenue:
        label: "Revenue change in weakest year shown"
        field: worst_year_revenue_change
        unit: pct
        direction: higher_better
        bands: [[0.0, A], [-0.05, B], [-0.20, C], [-0.35, D]]
        else: F
    caps:
      - when: "max_customer_pct is not None and max_customer_pct > 0.35"
        cap_at: 2
        reason: "customer concentration >35%"
      - when: "max_customer_pct is not None and max_customer_pct > 0.20"
        cap_at: 4
        reason: "customer concentration >20%"
      - when: "worst_year_revenue_change is not None and worst_year_revenue_change < -0.20"
        cap_at: 6
        reason: "revenue fell >20% in a shown year (cyclical revenue)"

  # ---------------------------------------------------------------- 8
  market_sentiment:
    display: "Market Sentiment"
    sheet_row_offset: 8
    aggregate: median
    submetrics:
      short_interest:
        label: "Short interest % of float"
        field: short_pct_float
        unit: pct
        direction: lower_better
        bands: [[0.02, A], [0.05, B], [0.08, C], [0.15, D]]
        else: F
      institutional_trend:
        label: "Institutional ownership trend"
        field: institutional_trend_score   # -1 / 0 / +1
        unit: score
        direction: higher_better
        bands: [[0.5, A], [0.5, B], [-0.5, C], [-0.9, D]]
        else: F
      insider_net_6mo:
        label: "Insider net open-market activity (6mo)"
        field: insider_net_score
        unit: score
        direction: higher_better
        bands: [[1.5, A], [0.5, B], [-0.5, C], [-1.5, D]]
        else: F

  # ---------------------------------------------------------------- 9
  eps_revisions:
    display: "EPS/Revison Trends"     # spelling matches the workbook
    sheet_row_offset: 9
    aggregate: median
    submetrics:
      fy2_change_3mo:
        label: "FY2 consensus EPS change vs 3mo ago"
        field: fy2_eps_change_3mo
        unit: pct
        direction: higher_better
        bands: [[0.05, A], [0.02, B], [-0.02, C], [-0.05, D]]
        else: F
      revision_breadth:
        label: "Revision breadth (share up)"
        field: revision_breadth_up
        unit: pct
        direction: higher_better
        bands: [[0.70, A], [0.55, B], [0.45, C], [0.30, D]]
        else: F
      surprise_history:
        label: "EPS beats, last 8Q"
        field: beat_count_8q
        unit: count
        direction: higher_better
        bands: [[6, A], [5, B], [4, C], [2, D]]
        else: F

  # ---------------------------------------------------------------- 10
  industry:
    display: "Industry/Sector Tailwinds"
    sheet_row_offset: 10
    aggregate: median
    submetrics:
      peer_median_growth:
        label: "Peer-median fwd revenue growth"
        field: peer_median_fwd_growth
        unit: pct
        direction: higher_better
        bands: [[0.10, A], [0.05, B], [0.00, C], [-0.0001, D]]
        else: F

# =============================================================================
# ARCHETYPE WEIGHTS -- must match the M36:T47 matrix in the workbook
# =============================================================================
archetypes:
  A:
    name: "A: Mature Cash Generator"
    weights: {valuation: 0.25, growth: 0.05, profitability: 0.15, financials: 0.10,
              business_quality: 0.15, management: 0.10, income: 0.10,
              market_sentiment: 0.025, eps_revisions: 0.025, industry: 0.05}
  B:
    name: "B: Durable Compounder"
    weights: {valuation: 0.15, growth: 0.15, profitability: 0.15, financials: 0.10,
              business_quality: 0.20, management: 0.10, income: 0.05,
              market_sentiment: 0.025, eps_revisions: 0.05, industry: 0.025}
  C:
    name: "C: High Growth"
    weights: {valuation: 0.10, growth: 0.25, profitability: 0.05, financials: 0.15,
              business_quality: 0.20, management: 0.10, income: 0.05,
              market_sentiment: 0.025, eps_revisions: 0.05, industry: 0.025}
  D:
    name: "D: Cyclical / Commodity"
    weights: {valuation: 0.15, growth: 0.05, profitability: 0.10, financials: 0.20,
              business_quality: 0.05, management: 0.10, income: 0.05,
              market_sentiment: 0.05, eps_revisions: 0.10, industry: 0.15}
  E:
    name: "E: Early Biotech"
    weights: {valuation: 0.05, growth: 0.10, profitability: 0.00, financials: 0.25,
              business_quality: 0.30, management: 0.15, income: 0.00,
              market_sentiment: 0.05, eps_revisions: 0.00, industry: 0.10}
  F:
    name: "F: Financial Institution"
    weights: {valuation: 0.15, growth: 0.10, profitability: 0.20, financials: 0.20,
              business_quality: 0.15, management: 0.10, income: 0.00,
              market_sentiment: 0.025, eps_revisions: 0.025, industry: 0.05}
  G:
    name: "G: Turnaround"
    weights: {valuation: 0.10, growth: 0.10, profitability: 0.10, financials: 0.20,
              business_quality: 0.10, management: 0.20, income: 0.00,
              market_sentiment: 0.05, eps_revisions: 0.10, industry: 0.05}

# =============================================================================
# RED FLAGS  (Section 3B)
# YELLOW -> caps the named category at 6
# RED    -> caps the named category at 2 AND the composite at 6.0
# Two or more RED -> UNINVESTABLE
# =============================================================================
red_flags:

  - id: fcf_ni_below_50_3y
    severity: RED
    category: financials
    when: "fcf_ni_below_50_streak is not None and fcf_ni_below_50_streak >= 3"
    message: "FCF/NI <50% for {fcf_ni_below_50_streak} consecutive years"

  - id: three_consecutive_misses
    severity: RED
    category: eps_revisions
    when: "consecutive_miss_streak is not None and consecutive_miss_streak >= 3"
    message: "{consecutive_miss_streak} consecutive EPS misses"

  - id: maturity_wall
    severity: RED
    category: financials
    when: "debt_due_24mo is not None and cash is not None and fcf is not None and debt_due_24mo > (cash + 2 * max(fcf, 0))"
    message: "Debt due <24mo ({debt_due_24mo:,.0f}) exceeds cash + 2yr FCF"

  - id: going_concern
    severity: RED
    category: financials
    when: "going_concern_flag is True"
    message: "Going-concern language present in filing"

  - id: customer_concentration_35
    severity: RED
    category: income
    when: "max_customer_pct is not None and max_customer_pct > 0.35"
    message: "Customer concentration {max_customer_pct:.1%} exceeds 35%"

  - id: runway_under_12mo
    severity: RED
    category: financials
    when: "cash_runway_years is not None and cash_runway_years < 1.0"
    message: "Cash runway {cash_runway_years:.2f} yrs is under 12 months"

  - id: two_consecutive_misses
    severity: YELLOW
    category: eps_revisions
    when: "consecutive_miss_streak is not None and consecutive_miss_streak == 2"
    message: "2 consecutive EPS misses"

  - id: dso_spike
    severity: YELLOW
    category: financials
    when: "dso_yoy_change is not None and dso_yoy_change > 0.15"
    message: "DSO up {dso_yoy_change:.1%} YoY"

  - id: ar_outrunning_revenue
    severity: YELLOW
    category: financials
    when: "ar_growth is not None and revenue_growth is not None and revenue_growth > 0 and ar_growth > 2 * revenue_growth"
    message: "AR growth {ar_growth:.1%} exceeds 2x revenue growth {revenue_growth:.1%}"

  - id: inventory_build
    severity: YELLOW
    category: financials
    when: "inventory_growth is not None and revenue_growth is not None and revenue_growth > 0 and inventory_growth > 2 * revenue_growth"
    message: "Inventory growth {inventory_growth:.1%} exceeds 2x revenue growth"

  - id: goodwill_impairment
    severity: YELLOW
    category: management
    when: "goodwill_impairment_pct_equity is not None and goodwill_impairment_pct_equity > 0.05"
    message: "Goodwill impairment {goodwill_impairment_pct_equity:.1%} of equity"

  - id: sbc_escalation
    severity: YELLOW
    category: management
    when: "sbc_pct_revenue is not None and sbc_pct_revenue_yoy_change is not None and sbc_pct_revenue > 0.10 and sbc_pct_revenue_yoy_change >= 0.02"
    message: "SBC/revenue at {sbc_pct_revenue:.1%}, up {sbc_pct_revenue_yoy_change:.1%} YoY"

  - id: insider_selling_cluster
    severity: YELLOW
    category: management
    when: "insider_sell_cluster_90d is not None and insider_sell_cluster_90d >= 3 and price_runup_6mo is not None and price_runup_6mo > 0.20"
    message: "{insider_sell_cluster_90d} insider open-market sales in 90d after a {price_runup_6mo:.0%} run-up"

  - id: fy2_erosion
    severity: YELLOW
    category: eps_revisions
    when: "fy2_eps_change_3mo is not None and fy2_eps_change_3mo < -0.10"
    message: "FY2 estimates down {fy2_eps_change_3mo:.1%}"

  - id: customer_concentration_20
    severity: YELLOW
    category: income
    when: "max_customer_pct is not None and 0.20 < max_customer_pct <= 0.35"
    message: "Customer concentration {max_customer_pct:.1%} exceeds 20%"

  - id: gross_margin_erosion
    severity: YELLOW
    category: business_quality
    when: "gross_margin_trend_2y_bps is not None and gross_margin_trend_2y_bps < -200"
    message: "Gross margin down {gross_margin_trend_2y_bps:.0f}bps over 2 yrs"

  - id: dividend_exceeds_fcf
    severity: YELLOW
    category: financials
    when: "dividend_fcf_payout_streak is not None and dividend_fcf_payout_streak >= 2"
    message: "Dividends exceeded FCF for {dividend_fcf_payout_streak} consecutive yrs"

# Flags that require data this pipeline cannot source -> reported as
# "not checkable" so nothing is silently assumed clean.
not_checkable_flags:
  - "Covenant proximity (requires debt covenant disclosures)"
  - "Restatement / material weakness (requires ICFR section parse)"
  - "Abrupt CFO or auditor departure (requires 8-K Item 5.02 monitoring)"
  - "Active SEC/DOJ investigation (requires legal-proceedings parse)"
  - "Serial one-time charges in 3 of last 4 years (requires unusual-items detail)"
  - "2 consecutive guidance cuts (requires guidance history feed)"
